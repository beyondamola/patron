name: Patron verification
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m 'not integration and not operator_integration' --junitxml=artifacts/raw/unit.xml
      - name: Labeled detector corpus and denominator report
        run: python -m ci.detector_corpus
      - name: Sanitize evidence
        if: always()
        run: python -m ci.checks artifacts --path artifacts/upload
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: unit-${{ matrix.python }}-${{ github.run_attempt }}
          path: artifacts/upload
          retention-days: 14
          if-no-files-found: error

  docker:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      PATRON_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}
      PATRON_CI_STRICT: '1'
      PATRON_RUN_DOCKER_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Docker preflight and pinned image pull
        run: python -m ci.checks prepare
      - name: Real scenarios (no retries)
        run: python -m pytest -m integration --junitxml=artifacts/raw/integration.xml -o junit_logging=all
      - name: Reject missing or skipped cases
        if: always()
        run: python -m ci.checks validate --path artifacts/raw/integration.xml
      - name: Real operator processes
        run: python -m pytest -m operator_integration --junitxml=artifacts/raw/operator.xml -o junit_logging=all
      - name: Reject missing or skipped operator qualification
        if: always()
        run: python -m ci.checks validate-operator --path artifacts/raw/operator.xml
      - name: Cleanup only this job's resources
        if: always()
        run: python -m ci.checks cleanup
      - name: Sanitize evidence
        if: always()
        run: python -m ci.checks artifacts --path artifacts/upload
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: docker-${{ matrix.runner }}-${{ github.run_attempt }}
          path: artifacts/upload
          retention-days: 14
          if-no-files-found: error
