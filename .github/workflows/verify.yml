name: Patron verification
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m 'not integration' --junitxml=artifacts/raw/unit.xml
      - name: Sanitize evidence
        if: always()
        run: python -m ci.checks artifacts --path artifacts/upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unit-${{ matrix.python }}-${{ github.run_attempt }}
          path: artifacts/upload
          retention-days: 14
          if-no-files-found: error

  docker:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      PATRON_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}
      PATRON_CI_STRICT: '1'
      PATRON_RUN_DOCKER_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Docker preflight and pinned image pull
        run: python -m ci.checks prepare
      - name: Real scenarios (no retries)
        run: python -m pytest -m integration --junitxml=artifacts/raw/integration.xml
      - name: Reject missing or skipped cases
        if: always()
        run: python -m ci.checks validate --path artifacts/raw/integration.xml
      - name: Cleanup only this job's resources
        if: always()
        run: python -m ci.checks cleanup
      - name: Sanitize evidence
        if: always()
        run: python -m ci.checks artifacts --path artifacts/upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: docker-${{ matrix.runner }}-${{ github.run_attempt }}
          path: artifacts/upload
          retention-days: 14
          if-no-files-found: error
